name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hw2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homework/hw2/app
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: homework/hw2/app/go.mod
          cache: false
      - name: Run unit tests
        run: go test -v ./...
      - name: Build Docker image
        run: docker build --build-arg VERSION=${{ github.sha }} -t hello-hw2:${{ github.sha }} .
